dsl: "0.1"
version: "1.0.0"
name: incident-investigation
namespace: io.casehub.soc
title: SOC Incident Investigation — adaptive threat response

spec:

  ## ─── Capabilities ───────────────────────────────────────────────────────────
  capabilities:
    - name: cbr-retrieval
      description: "Retrieve similar past incidents from CBR memory"
      inputProjection: "{ alert: .alert }"
      outputProjection: "{ retrievedIncidents: ., incidentStatus: \"TRIAGING\" }"

    - name: ioc-enrichment
      description: "Extract IOCs from alert data and enrich with threat intelligence"
      inputProjection: "{ alert: .alert, retrievedIncidents: .retrievedIncidents }"
      outputProjection: "{ iocEnrichment: ., incidentStatus: \"TRIAGING\" }"

    - name: attck-mapping
      description: "Map indicators and enrichment to MITRE ATT&CK techniques and tactics"
      inputProjection: "{ alert: .alert, iocEnrichment: .iocEnrichment, retrievedIncidents: .retrievedIncidents }"
      outputProjection: "{ attckMapping: ., incidentStatus: \"INVESTIGATING\" }"

    - name: containment-recommendation
      description: "Recommend containment actions based on threat analysis"
      inputProjection: "{ alert: .alert, iocEnrichment: .iocEnrichment, attckMapping: .attckMapping, retrievedIncidents: .retrievedIncidents }"
      outputProjection: "{ containmentRecommendation: ., incidentStatus: \"CONTAINING\" }"

    - name: containment-execution
      description: "Execute approved containment actions via ContainmentExecutor SPI"
      inputProjection: "{ alert: .alert, containmentRecommendation: .containmentRecommendation, actionGateApproved: .actionGateApproved, actionGateRejected: .actionGateRejected }"
      outputProjection: "{ containmentExecution: . }"

  ## ─── Goals ──────────────────────────────────────────────────────────────────
  goals:
    - name: resolved
      kind: success
      condition: ".analystDecision == \"resolved\" and .containmentExecution != null"

    - name: escalated
      kind: success
      condition: ".analystDecision == \"escalated\" and .containmentExecution != null"

    - name: false-positive
      kind: success
      condition: ".analystDecision == \"false-positive\" and .containmentExecution != null"

  ## ─── Completion ─────────────────────────────────────────────────────────────
  completion:
    success:
      anyOf:
        - resolved
        - escalated
        - false-positive

  ## ─── Bindings ────────────────────────────────────────────────────────────────
  bindings:

    ## Fires first — retrieves similar past incidents from CBR memory
    ## to enrich triage context for all downstream bindings.
    - name: cbr-retrieval
      on: { contextChange: {} }
      when: ".alert != null and .retrievedIncidents == null"
      capability: cbr-retrieval

    ## Fires after CBR retrieval. Extracts IOCs from the alert and
    ## queries threat intelligence feeds.
    - name: ioc-enrichment
      on: { contextChange: {} }
      when: ".alert != null and .iocEnrichment == null"
      capability: ioc-enrichment

    ## Fires after IOC enrichment. Maps indicators to ATT&CK techniques
    ## to build the threat narrative.
    - name: attck-mapping
      on: { contextChange: {} }
      when: ".iocEnrichment != null and .attckMapping == null"
      capability: attck-mapping

    ## Fires after ATT&CK mapping. Recommends containment actions
    ## based on the complete threat analysis. SocActionRiskClassifier
    ## gates high-impact containment actions for human approval.
    - name: containment-recommendation
      on: { contextChange: {} }
      when: ".attckMapping != null and .containmentRecommendation == null"
      capability: containment-recommendation

    ## Human review — fires after containment recommendation is ready.
    ## Tier-1 analyst reviews findings, approves/rejects containment,
    ## and sets analystDecision to resolve the case.
    - name: analyst-review
      on: { contextChange: {} }
      when: ".containmentRecommendation != null and .analystDecision == null"
      humanTask:
        title: "Review incident findings and containment recommendation"
        candidateGroups:
          - soc-tier1-analyst
        outcomes:
          - CONFIRM_SEVERITY
          - DOWNGRADE
          - ESCALATE
          - FALSE_POSITIVE
        scopeExpression: >-
          "casehubio/soc/triage-review/" + (
            if .alert.severity == "CRITICAL" then "p1"
            elif .alert.severity == "HIGH" then "p2"
            else "p3"
            end
          )
        expiresInExpression: >-
          if .alert.severity == "CRITICAL" then "PT15M"
          elif .alert.severity == "HIGH" then "PT1H"
          elif .alert.severity == "MEDIUM" then "PT24H"
          else "PT24H"
          end
        inputMapping: >-
          {
            incidentId: .caseId,
            priority: .alert.severity,
            alert: .alert,
            iocEnrichment: .iocEnrichment,
            attckMapping: .attckMapping,
            containmentRecommendation: .containmentRecommendation,
            retrievedIncidents: .retrievedIncidents
          }
        outputMapping: >-
          {
            analystDecision: (
              if .outcome == "CONFIRM_SEVERITY" or .outcome == "DOWNGRADE"
              then "resolved"
              elif .outcome == "ESCALATE" then "escalated"
              elif .outcome == "FALSE_POSITIVE" then "false-positive"
              elif .outcome == null then "escalated"
              else .outcome
              end
            ),
            analystOutcome: .outcome,
            analystId: .completedBy,
            incidentStatus: (
              if .outcome == "FALSE_POSITIVE" then "FALSE_POSITIVE"
              elif .outcome == "ESCALATE" then "ESCALATED"
              else "RESOLVED"
              end
            )
          }

    ## Containment execution — fires after analyst confirms the incident.
    ## Executes the containment action if approved or autonomous,
    ## skips if rejected or no containment was recommended.
    - name: containment-execution
      on: { contextChange: {} }
      when: ".analystDecision != null and .containmentExecution == null"
      capability: containment-execution
