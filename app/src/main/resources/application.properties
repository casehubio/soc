quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:soc;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-at-start=true
quarkus.flyway.locations=classpath:db/work/migration

quarkus.datasource.memory.db-kind=h2
quarkus.datasource.memory.jdbc.url=jdbc:h2:mem:soc-memory;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.flyway.memory.migrate-at-start=true
%dev.quarkus.flyway.memory.clean-at-start=true
%test.quarkus.flyway.memory.clean-at-start=true
quarkus.flyway.memory.locations=classpath:db/memory/migration

quarkus.datasource.qhorus.db-kind=h2
quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:soc-qhorus;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.flyway.qhorus.migrate-at-start=true
%dev.quarkus.flyway.qhorus.clean-at-start=true
%test.quarkus.flyway.qhorus.clean-at-start=true
quarkus.flyway.qhorus.locations=classpath:db/qhorus/migration,classpath:db/ledger/migration,classpath:db/soc/migration
quarkus.hibernate-orm.qhorus.packages=io.casehub.qhorus.runtime,io.casehub.ledger.runtime.model,io.casehub.ledger.model,io.casehub.soc.engine.compliance

quarkus.hibernate-orm.packages=io.casehub.work.runtime.model,\
  io.casehub.work.runtime.filter,io.casehub.platform.memory.jpa
quarkus.hibernate-orm.database.generation=none

quarkus.arc.selected-alternatives=io.casehub.persistence.memory.InMemoryPlanItemStore,\
  io.casehub.persistence.memory.InMemoryEventLogRepository,\
  io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemorySubCaseGroupRepository,\
  io.casehub.persistence.memory.InMemoryReactiveEventLogRepository,\
  io.casehub.persistence.memory.InMemoryReactiveCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryReactiveCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryReactiveSubCaseGroupRepository,\
  io.casehub.persistence.memory.InMemoryReactivePlanItemStore

quarkus.arc.exclude-types=io.casehub.persistence.memory.DefaultTestPrincipal,\
  io.casehub.work.runtime.service.NoOpGroupMembershipProvider,\
  io.casehub.work.runtime.service.TenantScopedPrincipal,\
  io.casehub.engine.internal.worker.NoOpCapabilityHealth,\
  io.casehub.engine.internal.memory.CaseMemoryObserver,\
  io.casehub.platform.identity.quarkus.IdentityBeans,\
  io.casehub.ledger.runtime.service.identity.AgentIdentityVerificationService,\
  io.casehub.ledger.runtime.service.identity.ActorIdentityValidationEnricher

casehub.work.sla.breach-policy=soc-escalation

quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=22.15.0

# Containment connector routing (all actions -> simulated connector)
casehub.soc.containment.routing.isolate-host=sim
casehub.soc.containment.routing.wipe-endpoint=sim
casehub.soc.containment.routing.block-ip=sim
casehub.soc.containment.routing.block-domain=sim
casehub.soc.containment.routing.network-segmentation=sim
casehub.soc.containment.routing.disable-user-account=sim
casehub.soc.containment.routing.revoke-credentials=sim
casehub.soc.containment.routing.rotate-api-key=sim

# Simulated containment connector endpoint
casehub.soc.containment.endpoints.sim.url=http://localhost:${quarkus.http.port}/sim/containment
casehub.soc.containment.endpoints.sim.method=POST
casehub.soc.containment.endpoints.sim.timeout-seconds=10
